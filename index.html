<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d15"><title>VALONI-I Auto Servis | Mitrovicë</title><style>body{margin:0;background:#090d15;color:#e8edf6;font-family:Arial,sans-serif}#status{padding:30vh 16px;text-align:center}</style></head><body><div id="status">Duke hapur VALONI-I…</div><script>
(async function(){
 const status=document.getElementById('status');
 try {
  const response=await fetch('./site-original.html',{cache:'no-cache'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  let page=await response.text();
  function patch(before,after){
   if(!page.includes(before))throw new Error('Missing patch target: '+before.slice(0,80));
   page=page.replace(before,after);
  }
  patch(".join('')}</select>", ".join('')}<option value=\"other\">Të tjera</option></select>");
  patch("option.textContent=i===0?t.servicePlaceholder:t.services[i-1][0];",
        "option.textContent=i===0?t.servicePlaceholder:option.value==='other'?({sq:'Të tjera',sr:'Ostalo',en:'Other'}[lang]||'Të tjera'):t.services[i-1][0];");
  patch('id="preferredDate" name="preferredDate" type="date"',
        'id="preferredDate" name="preferredDate" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" autocomplete="off" aria-label="Data e preferuar DD/MM/YYYY"');
  patch("document.getElementById('preferredDate').min = new Date(Date.now()-new Date().getTimezoneOffset()*60_000).toISOString().slice(0,10);",
        "document.getElementById('preferredDate').dataset.min = new Date(Date.now()-new Date().getTimezoneOffset()*60_000).toISOString().slice(0,10);");
  patch("if(date && date<document.getElementById('preferredDate').min){",
        "if(date && (!dateIsValid(date) || toIsoDate(date)<document.getElementById('preferredDate').dataset.min)){");
  patch("const form = document.getElementById('bookingForm');",
        "function toIsoDate(value){const m=String(value||'').trim().match(/^([0-9]{2})[.\\/-]?([0-9]{2})[.\\/-]?([0-9]{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:'';}function dateIsValid(value){const iso=toIsoDate(value);if(!iso)return false;const [y,m,d]=iso.split('-').map(Number);const check=new Date(y,m-1,d);return check.getFullYear()===y&&check.getMonth()===m-1&&check.getDate()===d;}const dateField=document.getElementById('preferredDate');dateField.addEventListener('blur',()=>{const v=dateField.value.trim();if(/^[0-9]{8}$/.test(v))dateField.value=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);});const form = document.getElementById('bookingForm');");
  document.open();document.write(page);document.close();
 }catch(error){
  console.error('Site loading error:',error);
  status.textContent='Webfaqja nuk u ngarkua. Rifreskoni faqen.';
  const link=document.createElement('a');link.href='./site-original.html';link.textContent='Hap versionin origjinal';link.style.color='#79b5ff';
  status.append(document.createElement('br'),link);
 }
})();</script></body></html>
